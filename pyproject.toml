[project]
name = "preventmaker"
version = "0.1.0"
description = "Una semplice interfaccia grafica per poter creare preventivi velocemente e facilmente"
requires-python = ">=3.12"
dependencies = [
    "pyqt6",
    "reportlab",
    "pypdf2",
    "pyqt6-webengine",
    "mysql-connector-python",
    "qrcode>=8.2",
    "cryptography>=45.0.3",
    "notebook>=7.4.3",
    "python-dotenv>=1.1.0",
    "pyinstaller>=6.13.0",
]
